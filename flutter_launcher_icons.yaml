# Configuration for Ramzi's OWN app icon (not the icons Ramzi exports).
#
# Regenerate with:
#   flutter pub run flutter_launcher_icons
#
# The source artwork is generated by:
#   dart run tool/generate_ramzi_icon.dart
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/ramzi_icon.png"

  # Android adaptive icon (API 26+)
  adaptive_icon_foreground: "assets/branding/ramzi_icon_foreground.png"
  adaptive_icon_background: "#01091F"
  adaptive_icon_monochrome: "assets/branding/ramzi_icon_monochrome.png"
  min_sdk_android: 21

  # iOS (opaque, iOS applies its own mask)
  remove_alpha_ios: true
  background_color_ios: "#01091F"

  web:
    generate: true
    image_path: "assets/branding/ramzi_icon.png"
    background_color: "#01091F"
    theme_color: "#5B5BD6"

  windows:
    generate: true
    image_path: "assets/branding/ramzi_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/branding/ramzi_icon.png"
