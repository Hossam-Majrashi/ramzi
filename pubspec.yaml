name: ramzi
description: "Ramzi — multi-platform app icon simulator & exporter. Preview one source icon on every platform and export spec-compliant icon assets, fully offline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.5
  image: ^4.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  archive: ^4.0.9
  web: ^1.1.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/
